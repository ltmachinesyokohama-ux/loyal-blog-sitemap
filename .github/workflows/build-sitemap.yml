
name: LOYAL BLOG SITEMAP

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Generate Blog XML from BASE sitemap
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET

          HOME = 'https://www.bavariancustomirons.jp'
          PATTERN = re.compile(
              r'^https://www\.bavariancustomirons\.jp/blog/\d{4}/\d{2}/\d{2}/\d{6}$'
          )
          NS = 'http://www.sitemaps.org/schemas/sitemap/0.9'
          articles, seen = {}, set()

          def node_text(node, name):
              item = node.find('{*}' + name)
              return (item.text or '').strip() if item is not None else ''

          def collect(url, depth=0):
              if url in seen or depth > 4:
                  return
              if urllib.parse.urlparse(url).netloc != 'www.bavariancustomirons.jp':
                  raise ValueError('Unexpected sitemap host: ' + url)

              seen.add(url)
              req = urllib.request.Request(
                  url,
                  headers={'User-Agent': 'LOYAL-Sitemap-Generator/1.0'}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  root = ET.fromstring(response.read())

              kind = root.tag.rsplit('}', 1)[-1]

              if kind == 'sitemapindex':
                  for item in root.findall('{*}sitemap'):
                      sub = node_text(item, 'loc')
                      if sub:
                          collect(sub, depth + 1)

              elif kind == 'urlset':
                  for item in root.findall('{*}url'):
                      loc = node_text(item, 'loc').rstrip('/')
                      if PATTERN.fullmatch(loc):
                          mod = node_text(item, 'lastmod')
                          articles[loc] = (
                              mod if re.fullmatch(
                                  r'\d{4}-\d{2}-\d{2}', mod
                              ) else None
                          )
              else:
                  raise ValueError('Unexpected XML: ' + kind)

          collect(HOME + '/sitemap.xml')

          if len(articles) < 310:
              raise RuntimeError(
                  f'Expected at least 310 Blog URLs; found {len(articles)}.'
              )

          if len(articles) > 50000:
              raise RuntimeError('Sitemap splitting required.')

          os.makedirs('_site', exist_ok=True)
          ET.register_namespace('', NS)
          root = ET.Element('{' + NS + '}urlset')

          for loc, mod in sorted(articles.items()):
              item = ET.SubElement(root, '{' + NS + '}url')
              ET.SubElement(
                  item, '{' + NS + '}loc'
              ).text = loc

              if mod:
                  ET.SubElement(
                      item, '{' + NS + '}lastmod'
                  ).text = mod

          ET.indent(root, space='  ')
          ET.ElementTree(root).write(
              '_site/blog-sitemap.xml',
              encoding='utf-8',
              xml_declaration=True
          )

          with open(
              '_site/blog-urls.txt', 'w', encoding='utf-8'
          ) as f:
              f.write('\n'.join(sorted(articles)) + '\n')

          with open(
              '_site/index.html', 'w', encoding='utf-8'
          ) as f:
              f.write(
                  '<a href="blog-sitemap.xml">'
                  'LOYAL Blog Sitemap</a>'
              )

          print('Published Blog URLs:', len(articles))
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
